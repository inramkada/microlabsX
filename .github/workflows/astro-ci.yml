name: microLabsX v2 CI

on:
  push:
    branches:
      - microlabsx-v2
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ASTRO_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Source guardrails
        run: node scripts/guardrails.mjs

      - name: Install pinned dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Emit lockfile transfer token
        run: node -e "process.stdout.write('LOCKFILE_B64=' + require('fs').readFileSync('package-lock.json').toString('base64') + '\\n')"

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Verify registry signatures
        run: npm audit signatures

      - name: Validate production build
        run: npm run build

      - name: Enforce output budgets
        run: npm run check:dist

      - name: Verify extracted specimen assets
        run: |
          test -s public/assets/models/tardigrade.glb
          test -s public/assets/models/crypto-specimen.glb
          du -h public/assets/models/*.glb
